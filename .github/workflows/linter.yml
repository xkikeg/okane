name: "ci-linter"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  checks: write

jobs:
  clippy:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1.94.1
        with:
          components: clippy
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: check-clippy
        uses: auguwu/clippy-action@9817d076b82df0194935be9db6154c56ac07b317 # v1.5.0
        with:
          deny: warnings
          token: ${{ secrets.GITHUB_TOKEN }}
          check-args: --all-features --all-targets --workspace
  cargo-deny:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
  cargo-about:
    # The release archives ship a THIRD-PARTY-LICENSES.html generated by
    # cargo-about, so make sure every dependency still has a license text we
    # can find and redistribute. Without this, a new dependency only breaks the
    # release workflow, after the tag is already pushed.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1.94.1
      with:
        toolchain: stable
    - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
      with:
        tool: cargo-about
    # No --target: about.toml lists every released target, so this covers all
    # of the archives at once.
    - run: cargo about generate --fail --locked -m cli/Cargo.toml -o /dev/null about.hbs
