name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-release:
    uses: ./.github/workflows/build-binary.yml
    with:
      version: ${{ github.ref_name }}
      # A release wants to know about every broken target at once, not just the
      # first one.
      fail-fast: false

  publish-release:
    name: Publish the release assets
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: archives
      - name: Upload to Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # One directory per matrix target, each holding a single archive.
          files: |
            archives/*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
