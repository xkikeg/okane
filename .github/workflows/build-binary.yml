# Builds the release archives, one per target, and uploads them as workflow
# artifacts. Called both by the Release workflow, which turns the artifacts
# into release assets, and by the Binary workflow, which only checks that the
# build still works on every target before a tag is pushed.
name: Build binary

on:
  workflow_call:
    inputs:
      version:
        description: >
          Version part of the archive name, i.e. okane-<version>-<target>.
          The release passes the tag, CI passes the commit SHA.
        required: true
        type: string
      fail-fast:
        description: >
          Whether the first failing target cancels the remaining ones. CI does
          not need every failure of the same breakage, a release does.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build for ${{ matrix.target }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        include:
          - build: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          # Built on a native arm64 runner, free for public repositories, so
          # that no cross toolchain is needed.
          - build: linux-aarch64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          # glibc archives ship next to the musl ones because musl's
          # allocator costs 1.2-1.5x on the report path (#561). musl stays for
          # Alpine, for distributions older than the runners below, and for
          # anyone who wants a fully static binary; cargo-binstall picks the
          # archive matching the host triple, so glibc users get the faster
          # build without asking for it. Built on the oldest still-supported
          # runner, since a glibc binary only runs on a glibc at least as new
          # as the one it was linked against.
          - build: linux-x86_64-gnu
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - build: linux-aarch64-gnu
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - build: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - build: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - build: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1.94.1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # One cache per matrix entry. rust-cache keys on the job id plus
      # `Linux`/`x64`, which does not tell the runner images apart, so the
      # 24.04 musl job and the 22.04 glibc job would otherwise share a target/
      # directory. The host build scripts cached by the newer image then fail
      # to run on the older one with `GLIBC_2.39 not found`.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.build }}
      - name: Install cargo-about
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-about
      - name: Install packages (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xz-utils liblz4-tool musl-tools
      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }} --verbose
      - name: Collect dependency licenses
        shell: bash
        # The binary statically links its dependencies, so the archive has to
        # carry their license texts. --target keeps the notice to the crates
        # actually linked into this archive's binary.
        run: |
          cargo about generate --fail --locked \
            --manifest-path cli/Cargo.toml \
            --target ${{ matrix.target }} \
            --output-file THIRD-PARTY-LICENSES.html \
            about.hbs
      - name: Package Artifacts
        shell: bash
        # The version reaches the script through the environment, so that a
        # crafted tag name cannot inject shell code here.
        env:
          VERSION: ${{ inputs.version }}
        run: |
          staging="okane-${VERSION}-${{ matrix.target }}"
          outdir="target/${{ matrix.target }}/release"
          mkdir "$staging"
          cp README.md README.ja.md LICENSE CHANGELOG.md THIRD-PARTY-LICENSES.html "$staging/"
          if [[ "${{ matrix.os }}" =~ windows.* ]]; then
            cp "$outdir/okane.exe" "$staging/"
            cd "$staging"
            7z a "../$staging.zip" .
            echo "ASSET=$staging.zip" >> $GITHUB_ENV
          else
            cp "$outdir/okane" "$staging/"
            tar czf "$staging.tar.gz" -C "$staging" .
            echo "ASSET=$staging.tar.gz" >> $GITHUB_ENV
          fi
      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.build }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          # The release assets live on the release page, and the CI ones are
          # only there to look at when a build misbehaves.
          retention-days: 7
